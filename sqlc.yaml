version: "2"
sql:
  - engine: "postgresql"
    queries: "queries.sql"
    schema: "schema"
    gen:
      go:
        package: "gotopo"
        out: "gotopo"
        sql_package: "pgx/v5"
        overrides:
          - column: "tlm_strasse.shape"
            go_type:
              import: "github.com/twpayne/go-geom"
              package: "geom"
              type: "MultiLineString"

          - column: "vertices.location"
            go_type:
              import: "github.com/twpayne/go-geom"
              package: "geom"
              type: "Point"

          - column: "edges.shape"
            go_type:
              import: "github.com/twpayne/go-geom"
              package: "geom"
              type: "LineString"